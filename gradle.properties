org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Keep the explicit Kotlin Gradle Plugin (2.4.21) instead of AGP 9's built-in Kotlin,
# so the Kotlin version stays pinned and matches the local kotlinc toolchain.
# Requires both flags: builtInKotlin=false + newDsl=false (KGP is incompatible with AGP 9's new DSL).
android.builtInKotlin=false
android.newDsl=false
