name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # android-actions/setup-android@v3 cannot resolve the versioned
      # `platforms;android-37.0` package (Android 17's minor-versioned SDK name),
      # so install the SDK packages manually.
      - name: Set up Android SDK
        run: |
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDKROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)
          SDKMANAGER="${SDKMANAGER:-sdkmanager}"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "build-tools;36.0.0" > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" > /dev/null 2>&1 \
            || "$SDKMANAGER" --channel=3 "platforms;android-37.0" > /dev/null 2>&1

      - name: Build and test
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: novara-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
